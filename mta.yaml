_schema-version: 3.3.0
ID: pre_order
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm i
        - npx cds build --production
modules:
  - name: pre_order-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
      ignore:
        - node_modules
        - default-env.json
        - .env
        - .cdsrc-private.json
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: pre_order-auth
      - name: pre_order-db
      - name: pre_order-destination
      - name: pre_order-connectivity

  - name: pre_order-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: pre_order-db

  - name: pre_order-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: pre_order-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - name: pre_orderaccesscontrolgroups
          artifacts:
            - access-control-groups.zip
          target-path: app/
        - name: pre_orderaccesscontrolgroupsconsumertopics
          artifacts:
            - access-control-groups-consumer-topics.zip
          target-path: app/
        - name: pre_orderconsumertopicbrand
          artifacts:
            - consumertopicbrand.zip
          target-path: app/
        - name: pre_orderwritingappointment
          artifacts:
            - writingappointment.zip
          target-path: app/
        - name: pre_orderproducts
          artifacts:
            - products.zip
          target-path: app/
        - name: pre_orderplanning
          artifacts:
            - planning.zip
          target-path: app/
        - name: pre_ordercheckandapprove
          artifacts:
            - checkandapprove.zip
          target-path: app/

  - name: pre_orderproducts
    type: html5
    path: app/products
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []
  - name: pre_orderplanning
    type: html5
    path: app/planning
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []
  - name: pre_orderaccesscontrolgroups
    type: html5
    path: app/access-control-groups
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []
  - name: pre_orderaccesscontrolgroupsconsumertopics
    type: html5
    path: app/access-control-groups-consumer-topics
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []
  - name: pre_orderconsumertopicbrand
    type: html5
    path: app/consumertopicbrand
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []
  - name: pre_orderwritingappointment
    type: html5
    path: app/writingappointment
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []
  - name: pre_ordercheckandapprove
    type: html5
    path: app/check-and-approve
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: pre_order-destinations
    type: com.sap.application.content
    requires:
      - name: pre_order-auth
        parameters:
          service-key:
            name: pre_order-auth-key
      - name: pre_order-html5-repo-host
        parameters:
          service-key:
            name: pre_order-html5-repo-host-key
      - name: srv-api
      - name: pre_order-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: pre_order-html5-repository
              ServiceInstanceName: pre_order-html5-repo-host
              ServiceKeyName: pre_order-html5-repo-host-key
              sap.cloud.service: com.valantic.preorder
            - Name: pre_order-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: pre_order-auth
              ServiceKeyName: pre_order-auth-key
              sap.cloud.service: com.valantic.preorder

resources:
  - name: pre_order-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: pre_order-${org}-${space}
        tenant-mode: dedicated
  - name: pre_order-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: pre_order-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: pre_order-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: pre_order-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
              - Name: ui5
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
  - name: pre_order-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
